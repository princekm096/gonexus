name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Extractor deps
        run: cd tools/ts-extractor && npm install
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Web build
        run: cd web && npm install && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gonexus:ci .
