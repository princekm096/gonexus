syntax = "proto3";

package gonexus.v1;

option go_package = "github.com/yourorg/gonexus/gen/gonexus/v1;gonexusv1";

// GoNexusService exposes the code knowledge graph over gRPC / Connect.
// Served by connect-go, so the same endpoint answers gRPC, gRPC-Web, and the
// Connect protocol (browser fetch) with no proxy.
service GoNexusService {
  // Index parses a repo into the graph and persists it.
  rpc Index(IndexRequest) returns (IndexResponse) {}
  // Query is hybrid name/symbol search.
  rpc Query(QueryRequest) returns (QueryResponse) {}
  // Context returns a symbol with its incoming/outgoing edges (360° view).
  rpc Context(ContextRequest) returns (ContextResponse) {}
  // Impact returns the transitive callers (blast radius) of a symbol.
  rpc Impact(ImpactRequest) returns (ImpactResponse) {}
  // Trace returns the shortest call path between two symbols.
  rpc Trace(TraceRequest) returns (TraceResponse) {}
  // Subgraph returns nodes+edges around a symbol for visualization.
  rpc Subgraph(SubgraphRequest) returns (SubgraphResponse) {}
  // Repos lists the registered (indexed) repositories.
  rpc Repos(ReposRequest) returns (ReposResponse) {}
  // EntryPoints lists execution-flow roots (main, handlers, commands).
  rpc EntryPoints(EntryPointsRequest) returns (EntryPointsResponse) {}
  // Process returns the call-tree flow rooted at a symbol.
  rpc Process(ProcessRequest) returns (ProcessResponse) {}
  // Clusters returns emergent modules (community detection).
  rpc Clusters(ClustersRequest) returns (ClustersResponse) {}
  // DetectChanges maps a git diff to changed symbols and their blast radius.
  rpc DetectChanges(DetectChangesRequest) returns (DetectChangesResponse) {}
  // Rename plans (and optionally applies) a multi-file symbol rename.
  rpc Rename(RenameRequest) returns (RenameResponse) {}
  // Wiki generates architecture documentation from the graph.
  rpc Wiki(WikiRequest) returns (WikiResponse) {}
  // Explain returns taint (source→sink) findings (requires --pdg indexing).
  rpc Explain(ExplainRequest) returns (ExplainResponse) {}
  // PdgQuery returns a function's control/data dependence summary (--pdg).
  rpc PdgQuery(PdgQueryRequest) returns (PdgQueryResponse) {}
  // Check validates symbol ids and reports dangling edges.
  rpc Check(CheckRequest) returns (CheckResponse) {}
  // Cypher runs a single-hop graph pattern query.
  rpc Cypher(CypherRequest) returns (CypherResponse) {}
  // RouteMap lists detected HTTP endpoint → handler mappings.
  rpc RouteMap(RouteMapRequest) returns (RouteMapResponse) {}
  // ApiImpact returns the blast radius of the handler(s) behind a route.
  rpc ApiImpact(ApiImpactRequest) returns (ApiImpactResponse) {}
  // Ask answers a natural-language question about a repo (RAG over the graph).
  rpc Ask(AskRequest) returns (AskResponse) {}
  // ShapeCheck validates consumer property access against provider type shapes.
  rpc ShapeCheck(ShapeCheckRequest) returns (ShapeCheckResponse) {}
}

// repo names which registered repository a query targets. Empty selects the
// sole repo when exactly one is registered.

message Node {
  string id = 1;
  string kind = 2;
  string name = 3;
  string package = 4;
  string file = 5;
  int32 line = 6;
  string signature = 7;
  string doc = 8;
}

message Edge {
  string from = 1;
  string to = 2;
  string kind = 3;
}

message IndexRequest {
  string path = 1;
  string name = 2; // optional; defaults to the directory base name
}
message IndexResponse {
  int32 nodes = 1;
  int32 edges = 2;
  string name = 3;
}

message QueryRequest {
  string q = 1;
  int32 limit = 2;
  string repo = 3;
}
message QueryResponse { repeated Node results = 1; }

message ContextRequest {
  string id = 1;
  string repo = 2;
}
message ContextResponse {
  Node node = 1;
  repeated Edge incoming = 2;
  repeated Edge outgoing = 3;
}

message ImpactRequest {
  string id = 1;
  string repo = 2;
}
message ImpactHit {
  string id = 1;
  int32 depth = 2;       // call-graph distance from the changed symbol
  double confidence = 3; // 1/depth: direct callers 1.0, two hops 0.5, ...
}
message ImpactResponse {
  repeated string ids = 1;      // flat list (all transitive callers)
  repeated ImpactHit hits = 2;  // depth-grouped with confidence
}

message TraceRequest {
  string from = 1;
  string to = 2;
  string repo = 3;
}
message TraceResponse { repeated string path = 1; }

message SubgraphRequest {
  string id = 1;
  int32 depth = 2;
  string repo = 3;
}
message SubgraphResponse {
  repeated Node nodes = 1;
  repeated Edge edges = 2;
}

message ReposRequest {}
message Repo {
  string name = 1;
  string path = 2;
  int32 nodes = 3;
  bool stale = 4; // source changed since last index
}
message ReposResponse { repeated Repo repos = 1; }

message EntryPointsRequest { string repo = 1; }
message EntryPoint {
  Node node = 1;
  int32 size = 2; // number of nodes in this entry point's flow
}
message EntryPointsResponse { repeated EntryPoint entries = 1; }

message ProcessRequest {
  string id = 1;
  string repo = 2;
}
message ProcessResponse {
  repeated Node nodes = 1;
  repeated Edge edges = 2;
}

message ClustersRequest { string repo = 1; }
message Cluster {
  string id = 1;
  string name = 2;
  repeated string members = 3;
  double cohesion = 4; // internal/incident edge weight, 0..1
}
message ClustersResponse { repeated Cluster clusters = 1; }

message DetectChangesRequest {
  string repo = 1;
  string base = 2; // git ref to diff against; empty = working tree vs HEAD
}
message DetectChangesResponse {
  repeated Node changed = 1;   // symbols the diff touched
  repeated string impacted = 2; // transitive callers (blast radius)
}

message RenameRequest {
  string repo = 1;
  string id = 2;       // symbol id to rename
  string new_name = 3;
  bool apply = 4;      // false = plan only; true = write the edits
}
message RenameEdit {
  string file = 1;
  repeated int32 lines = 2;
}
message RenameResponse {
  string old_name = 1;
  string new_name = 2;
  repeated RenameEdit edits = 3;
  int32 occurrences = 4;
  double confidence = 5; // 1.0 when the name is unique in the repo
  bool applied = 6;
}

message WikiRequest { string repo = 1; }
message WikiResponse { string markdown = 1; }

message ExplainRequest {
  string repo = 1;
  string id = 2; // optional: filter to one function
}
message TaintFinding {
  string func = 1;
  string source = 2;
  string sink = 3;
  int32 line = 4;
}
message ExplainResponse { repeated TaintFinding findings = 1; }

message PdgQueryRequest {
  string repo = 1;
  string id = 2; // function id
}
message ControlEdge {
  int32 from = 1;
  int32 to = 2;
}
message PdgQueryResponse {
  string id = 1;
  int32 blocks = 2;
  repeated ControlEdge ctrl_edges = 3;
  int32 data_edges = 4;
  repeated string params = 5;
}

message CheckRequest {
  string repo = 1;
  repeated string ids = 2;
}
message CheckResponse {
  repeated string missing = 1;
  repeated Edge dangling = 2;
}

message CypherRequest {
  string repo = 1;
  string pattern = 2; // (a:Kind)-[:EDGE]->(b:Kind)
  int32 limit = 3;
}
message CypherResponse { repeated Edge edges = 1; }

message Route {
  string method = 1;
  string path = 2;
  string handler = 3;
}
message RouteMapRequest { string repo = 1; }
message RouteMapResponse { repeated Route routes = 1; }

message ApiImpactRequest {
  string repo = 1;
  string path = 2; // optional: filter to one route path
}
message RouteImpact {
  Route route = 1;
  repeated string impacted = 2;
}
message ApiImpactResponse { repeated RouteImpact routes = 1; }

message AskRequest {
  string repo = 1;
  string question = 2;
}
message AskResponse {
  string answer = 1;
  repeated Node sources = 2; // symbols used as context
}

message ShapeCheckRequest { string repo = 1; }
message ShapeFinding {
  string object = 1;
  string type = 2;
  string file = 3;
  repeated string unknown = 4; // accessed props not on the provider type
}
message ShapeCheckResponse { repeated ShapeFinding findings = 1; }
